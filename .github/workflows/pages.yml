name: Deploy auf GitHub Pages

# Die KI-Werkstatt ist bewusst buildfrei (reines HTML/CSS/JS, damit sie auch
# lokal per Doppelklick funktioniert) — deshalb wird das Repo unverändert
# als Pages-Artefakt hochgeladen.

on:
  push:
    branches:
      - claude/school-ai-project-ideas-7sby8p
      # Wenn der Stand auf den Hauptbranch gemergt wird, hier ergaenzen:
      # - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Parallele Deploys vermeiden.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
